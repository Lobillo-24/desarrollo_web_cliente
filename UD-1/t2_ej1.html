<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T2_ej1</title>
</head>
<body>
Operaciones de comparación: <br><br>
<script>
 
    let Operacion1 = 20==20
    document.write("20==20 es " + Operacion1 + "<br>");
    let Operacion2 = 20>20
    document.write("20>20 es " + Operacion2 + "<br>");
    let Operacion3 = 20 > 20.0
    document.write("20>20.0 es " + Operacion3 + "<br>");
    let Operacion4 = "Juan" == "juan"
    document.write("`Juan` == `juan` es " + Operacion4 + "<br>");
    let Operacion5 = "Juan" > "juan"
    document.write("`Juan` > `juan` es " + Operacion5 + "<br>");
    let Operacion6 = "Juan" < "juan"
    document.write("`Juan` < `juan` es " + Operacion6 + "<br>");
    let Operacion7 = "123" == 123
    document.write("`123` == 123 es " + Operacion7 + "<br>");
    let Operacion8 = "123" === 123
    document.write("`123` === 123 es " + Operacion8 + "<br>");
    let Operacion9 = parseInt("123") === 123
    document.write("parseInt(`123`) === 123 es " + Operacion9 + "<br>");

</script>
</body>
</html>
