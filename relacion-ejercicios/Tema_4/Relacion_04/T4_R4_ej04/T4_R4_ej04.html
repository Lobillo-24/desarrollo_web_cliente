<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="tarjeta">

        <!-- Panel izquierdo con la "ilustración" -->
        <div class="panel-izquierdo">
            <p class="logo">crowdrise</p>
            <div class="ilustracion">
                <div class="circulo circulo-grande"></div>
                <div class="circulo circulo-mediano"></div>
                <div class="circulo circulo-pequeno"></div>
            </div>
        </div>

        <!-- Panel derecho con el formulario -->
        <div class="panel-derecho">

            <h1>Welcome to Crowdrise</h1>
            <p class="texto-intro">Let's get you all set up so you can verify your nonprofit and begin setting up your first campaign!</p>
            <p class="texto-login">Already have an account? <a href="#">Log in.</a></p>

            <form id="formulario" novalidate>

                <div class="fila">
                    <div class="grupo">
                        <label for="nombre">First Name</label>
                        <input type="text" id="nombre" name="nombre">
                        <small class="mensaje-error" id="error-nombre"></small>
                    </div>
                    <div class="grupo">
                        <label for="apellido">Last Name</label>
                        <input type="text" id="apellido" name="apellido">
                        <small class="mensaje-error" id="error-apellido"></small>
                    </div>
                </div>

                <div class="fila">
                    <div class="grupo">
                        <label for="telefono">Phone</label>
                        <input type="tel" id="telefono" name="telefono">
                        <small class="mensaje-error" id="error-telefono"></small>
                    </div>
                    <div class="grupo">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">
                        <small class="mensaje-error" id="error-email"></small>
                    </div>
                </div>

                <div class="fila">
                    <div class="grupo">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password">
                        <small class="mensaje-error" id="error-password"></small>
                    </div>
                    <div class="grupo">
                        <label for="confirmar">Confirm Password</label>
                        <input type="password" id="confirmar" name="confirmar">
                        <small class="mensaje-error" id="error-confirmar"></small>
                    </div>
                </div>

                <div class="grupo-check">
                    <input type="checkbox" id="emails" name="emails">
                    <label for="emails">Yes, I want to receive Crowdrise's emails</label>
                </div>

                <div class="grupo-check">
                    <input type="checkbox" id="terminos" name="terminos">
                    <label for="terminos">I agree to the <a href="#">Terms</a>, <a href="#">Privacy Policy</a> and <a href="#">Fees</a>.</label>
                </div>
                <small class="mensaje-error" id="error-terminos"></small>

                <button type="submit" class="boton-registro">Sign Up</button>

            </form>

            <p class="texto-pie">Don't work for a nonprofit? <a href="#">You can still fundraise for one.</a></p>

        </div>

    </div>


<script type="module" src="main.js"></script>
</body>
</html>
