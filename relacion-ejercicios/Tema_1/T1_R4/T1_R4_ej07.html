<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T1_R4_ej07</title>
</head>
<body>

<h1>Comprobar si un número es divisible entre otro</h1>

<input type="number" name="num1" id="num1" placeholder="Número">
<input type="number" name="num2" id="num2" placeholder="Divisible entre">
<button type="button" onclick="comprobar()">Comprobar</button>
<input type="text" name="resultado" id="resultado" placeholder="resultado" readonly>

<script>

function divisibleEntre(a, b) {
    if (a % b === 0) {
        return true;
    } else {
        return false;
    }
}

function comprobar() {
    let valor1 = parseInt(document.getElementById("num1").value);
    let valor2 = parseInt(document.getElementById("num2").value);

    let resultadoFinal = divisibleEntre(valor1, valor2);
    
    document.getElementById("resultado").value = resultadoFinal;
}

</script>

</body>
</html>
