<body>
<script>

let contras = "suárez";
let contras_usuario = prompt("Introduce la contraseña").toLowerCase().trim();

    while (contras_usuario !== contras) {
        if (contras_usuario === "") {
            contras_usuario = prompt("Introduce la contraseña");
        }else {
            contras_usuario = prompt("Contraseña incorrecta, vuelve a introducirla");
        }
    }

</script>
