<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T1_R4_ej09</title>
</head>
<body>

<h1>Comprobar si tiene 3 dígitos</h1>

<input type="number" name="numero" id="numero" placeholder="Introduce un número">
<button type="button" onclick="comprobar()">Comprobar</button>
<input type="text" name="resultado" id="resultado" placeholder="resultado" readonly>

<script>

function tieneTresDigitos(numero) {
    // Un número de 3 dígitos está entre el 100 y el 999
    if (numero >= 100 && numero <= 999) {
        return "sí";
    } else {
        return "no";
    }
}

function comprobar() {
    let valor = parseInt(document.getElementById("numero").value);
    let resultadoFinal = tieneTresDigitos(valor);
    
    document.getElementById("resultado").value = resultadoFinal;
}

</script>

</body>
</html>
