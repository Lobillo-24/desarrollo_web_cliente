<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T1_R4_ej06</title>
</head>
<body>

<h1>Comprobar si es divisible por 3</h1>

<button type="button" onclick="probar()">Probar divisible(9)</button>
<input type="text" name="resultado" id="resultado" placeholder="resultado" readonly>

<script>

function divisible(numero) {
    // Si el resto de dividir entre 3 es 0, significa que es divisible
    if (numero % 3 === 0) {
        return true;
    } else {
        return false;
    }
}

function probar() {
    let resultadoFinal = divisible(9);
    document.getElementById("resultado").value = resultadoFinal;
}

</script>

</body>
</html>
