<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>T3_R1 - Ejercicio 1</title>
</head>
<body>
<h1>Máximo de 4 valores</h1>
<p id="resultado"></p>
<script>
function maximo(a, b, c, d) {
  return Math.max(a, b, c, d);
}

let n1 = Number(prompt("Introduce el valor 1"));
let n2 = Number(prompt("Introduce el valor 2"));
let n3 = Number(prompt("Introduce el valor 3"));
let n4 = Number(prompt("Introduce el valor 4"));

document.getElementById("resultado").textContent = "El máximo de " + n1 + ", " + n2 + ", " + n3 + " y " + n4 + " es " + maximo(n1, n2, n3, n4);
</script>
</body>
</html>
