<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>T3_R1 - Ejercicio 7</title>
</head>
<body>
<h1>Factorial del 1 al 10</h1>
<div id="tabla"></div>
<script>
function factorial(n) {
  let resultado = 1;
  for (let i = 2; i <= n; i++) {
    resultado *= i;
  }
  return resultado;
}

let tabla = "<table border='1'><tr><th>Número</th><th>Factorial</th></tr>";
for (let i = 1; i <= 10; i++) {
  tabla += "<tr><td>" + i + "</td><td>" + factorial(i) + "</td></tr>";
}
tabla += "</table>";
document.getElementById("tabla").innerHTML = tabla;
</script>
</body>
</html>
