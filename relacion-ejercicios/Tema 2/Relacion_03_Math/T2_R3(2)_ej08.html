<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T2_R3(2)_ej08</title>
</head>
<body>

<h1> Generador de 1 imágen de 3 aleatorias </h1>

    <script>

        function generarimagen() {
            let imagenes = [
                "src/img1.png",
                "src/img2.png",
                "src/img3.png"
            ];

            let indiceAleatorio = Math.floor(Math.random() * imagenes.length);
            let imagenSeleccionada = imagenes[indiceAleatorio];

            let imgElement = document.createElement("img");
            imgElement.src = imagenSeleccionada;

            document.body.appendChild(imgElement);
        }
        generarimagen();

    </script>
    
</body>
</html>
