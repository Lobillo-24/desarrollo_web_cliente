<body>

    <script>

        for (let continuar = true; continuar; continuar = confirm("¿Deseas calcular otra hipotenusa?")) {
            
            let cateto1 = prompt("Introduce el valor del primer cateto:");
            let cateto2 = prompt("Introduce el valor del segundo cateto:");

            let hipotenusa = Math.hypot(cateto1, cateto2);

            alert("La hipotenusa es: " + hipotenusa);
        }
    </script>
    
</body>
