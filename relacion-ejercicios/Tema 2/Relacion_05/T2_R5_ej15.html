<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

<script>
let contador = 5;

function CuentaAtras() {
    document.body.innerHTML = "Hemos cambiado de ubicación esta página, en breves momentos será redireccionado... " + contador;
    
    if (contador > 0) {
        contador--;
    } else {
        clearInterval(temporizador);
        window.location.href = "http://www.pccomponentes.com";
    }
}

let temporizador = setInterval(CuentaAtras, 1000);
</script>

</body>
</html>
