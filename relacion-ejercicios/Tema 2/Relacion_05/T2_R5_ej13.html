<body>

<button onclick="CrearVentana()">Crear Ventana</button>
<button onclick="CerrarVentana()">Cerrar Ventana</button>

<script>
let vnueva = "";

function CrearVentana() {
    vnueva = window.open("", "", "width=500,height=400");

        vnueva.moveTo(1500, 0);
        vnueva.document.body.innerHTML = '<button onclick="window.close()">Cerrar</button>';

}

function CerrarVentana() {
        vnueva.close();
}
</script>
