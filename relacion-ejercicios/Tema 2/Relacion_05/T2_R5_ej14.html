<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T2_R5_ej14</title>
</head>
<body>

<h1 onclick="CrearVentana()"> Haz click aquí </h1>

<script>
let vnueva = "";

function CrearVentana() {
    for (let i = 0; i < 5; i++) {
        vnueva = window.open("", "", "width=350,height=350");
        vnueva.moveTo(1500, 0 + (i * 50));
        vnueva.document.body.innerHTML = '<button onclick="window.close()">Cerrar</button>';
        vnueva.document.title = "Ventana nº " + (i + 1);
    }
}

function CerrarVentana() {
        vnueva.close();
}
</script>

</body>
</html>
