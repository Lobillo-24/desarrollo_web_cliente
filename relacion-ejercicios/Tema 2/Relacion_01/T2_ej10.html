<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T3_ej10</title>
</head>
<body>

<script>
    // Pedimos una frase al usuario
    let frase = prompt("Introduce una frase:");
    let fraseMinuscula = frase.toLowerCase();
    
    // Contadores para cada vocal
    let contA = 0;
    let contE = 0;
    let contI = 0;
    let contO = 0;
    let contU = 0;

    // Recorremos la frase carácter por carácter
    for (let j = 0; j < fraseMinuscula.length; j++) {
        let letra = fraseMinuscula.charAt(j);
        
        switch (letra) {
            case 'a':
            case 'á':
                contA++;
                break;
            case 'e':
            case 'é':
                contE++;
                break;
            case 'i':
            case 'í':
                contI++;
                break;
            case 'o':
            case 'ó':
                contO++;
                break;
            case 'u':
            case 'ú':
                contU++;
                break;
        }
    }

    // Mostramos los resultados en pantalla
    document.write("Frase introducida: \"" + frase + "\"<br><br>");
    document.write("Conteo de cada vocal:<br>");
    document.write("• La vocal 'a' aparece: <strong>" + contA + "</strong> veces<br>");
    document.write("• La vocal 'e' aparece: <strong>" + contE + "</strong> veces<br>");
    document.write("• La vocal 'i' aparece: <strong>" + contI + "</strong> veces<br>");
    document.write("• La vocal 'o' aparece: <strong>" + contO + "</strong> veces<br>");
    document.write("• La vocal 'u' aparece: <strong>" + contU + "</strong> veces");
</script>

</body>
</html>
