<script>

const hoy = new Date();
const navidad = new Date(2026, 11, 19); // 19-dic-2026

const dias = Math.round((navidad - hoy) / (86400000)); // Como nos lo da en milisegundos y lo queremos en días, dividimos el resultado entre los milisegundos que tiene un día(86400000).

console.log(dias);
document.write(dias);

</script>
