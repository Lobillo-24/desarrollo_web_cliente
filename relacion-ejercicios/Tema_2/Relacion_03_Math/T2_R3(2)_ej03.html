<!DOCTYPE html>

    <title>T2_R3(2)_ej03</title>

<body>
    <h1>Calculo de un triángulo rectángulo</h1>
    <script>

        let cateto1 = prompt("Introduce la longitud del primer cateto:");
        let cateto2 = prompt("Introduce la longitud del segundo cateto:");
        let hipotenusa = Math.hypot(cateto1, cateto2);

        document.write("La hipotenusa es: " + hipotenusa + "<br>");

    </script>
    
</body>
