<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Screen</title>
</head>
<body>
    <h1>Información de la pantalla</h1>
    <table border="1">
        <tr><th>Propiedad</th><th>Valor</th></tr>
        <tr><td>width</td><td id="width"></td></tr>
        <tr><td>height</td><td id="height"></td></tr>
        <tr><td>availWidth</td><td id="availWidth"></td></tr>
        <tr><td>availHeight</td><td id="availHeight"></td></tr>
        <tr><td>colorDepth</td><td id="colorDepth"></td></tr>
        <tr><td>pixelDepth</td><td id="pixelDepth"></td></tr>
        <tr><td>orientation.type</td><td id="orientation"></td></tr>
    </table>
    <p><a href="index.html">Volver al menú</a></p>
    <script>
        document.getElementById("width").innerHTML = screen.width;
        document.getElementById("height").innerHTML = screen.height;
        document.getElementById("availWidth").innerHTML = screen.availWidth;
        document.getElementById("availHeight").innerHTML = screen.availHeight;
        document.getElementById("colorDepth").innerHTML = screen.colorDepth;
        document.getElementById("pixelDepth").innerHTML = screen.pixelDepth;
        if (screen.orientation) {
            document.getElementById("orientation").innerHTML = screen.orientation.type;
        } else {
            document.getElementById("orientation").innerHTML = "No disponible";
        }
    </script>
</body>
</html>
