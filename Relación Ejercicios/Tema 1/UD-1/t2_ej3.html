<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T2_ej3</title>
</head>
<body>
<script>    

    let Edad = parseInt(prompt("Introduce tu edad: "));
    if (Edad < 8) {
        document.write("Aún no tienes edad para jugar<br>");
    } else if (Edad >= 8 && Edad <= 9) {
        document.write("Eres benjamin<br>");
    } else if (Edad >= 10 && Edad <= 11) {
        document.write("Eres alevin<br>");
    } else if (Edad >= 12 && Edad <= 13) {
        document.write("Eres infantil<br>");
    } else if (Edad >= 14 && Edad <= 15) {
        document.write("Eres cadete<br>");
    } else if (Edad >= 16 && Edad <= 18) {
        document.write("Eres juvenil<br>");
    } else {
        document.write("Eres absoluto<br>");
    }

</script>
</body>
</html>
